<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 640" role="img" aria-labelledby="art-title art-desc"><title id="art-title">Estavo roi breakdown</title><desc id="art-desc">Example product interface and data visualization; no verified prices or availability are asserted.</desc><defs>
<linearGradient id="route" x1="0" x2="1"><stop stop-color="#5c91c7" stop-opacity=".16"/><stop offset="1" stop-color="#5c91c7" stop-opacity=".72"/></linearGradient>
<linearGradient id="soft-sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="640"><rect class="scene-sweep" x="-300" width="260" height="640" fill="url(#soft-sweep)"/></mask>
<style>@font-face{font-family:ArtPlex;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:ArtPlex;font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:ArtPlex,Arial,sans-serif;fill:#0b2239;font-size:21px;font-weight:400}.display{font-size:28px;font-weight:500}.title{font-size:24px;font-weight:500}.label{font-size:21px;font-weight:500}.small{font-size:19px;fill:#47749a}.micro{font-size:17px;fill:#47749a}.white{fill:#f5f9fc}.muted{fill:#a9c6e2}.mini{fill:none;stroke:#28567f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mini-light{stroke:#a9c6e2}.route{fill:none;stroke:url(#route);stroke-width:2;stroke-linecap:round}.energy{fill:none;stroke:#5c91c7;stroke-width:3;stroke-linecap:round}.float-a,.float-b,.float-c{transform-box:fill-box;transform-origin:center}.typing{opacity:.45}
@media(prefers-reduced-motion:no-preference){.scene-sweep{animation:sweep 11s cubic-bezier(.4,0,.2,1) infinite}.scene-float{animation:scene-float 13s ease-in-out infinite}.typing{animation:typing 1.4s ease-in-out infinite}}
@keyframes sweep{0%,12%{transform:translateX(0)}82%,100%{transform:translateX(1500px)}}@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes float-c{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes typing{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
@keyframes scene-float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.energy{display:none}.typing{opacity:.55;transform:none}}
</style></defs><g class="scene-float"><g class="float-a"><rect x="42" y="54" width="940" height="532" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><text x="958" y="94" text-anchor="end" class="title">Return calculation</text><text x="66" y="91" text-anchor="start" class="small">Example · no prices or projected rates</text><path d="M66 116L958 116" stroke="#dce7ef" stroke-opacity="1"/><rect x="66" y="140" width="574" height="300" rx="14" fill="#f7fafc" stroke="#dce7ef"/><text x="616" y="178" text-anchor="end" class="label">Price history</text><text x="90" y="176" text-anchor="start" class="micro">From purchase to today</text><path d="M96 228H610" stroke="#dce7ef" stroke-width="1"/><path d="M96 282H610" stroke="#dce7ef" stroke-width="1"/><path d="M96 336H610" stroke="#dce7ef" stroke-width="1"/><path d="M96 390H610" stroke="#dce7ef" stroke-width="1"/><path d="M112 360C174 344 214 351 270 320S370 292 420 270S520 214 590 202L590 390H112Z" fill="#dcecf5" fill-opacity=".75"/><path d="M112 360C174 344 214 351 270 320S370 292 420 270S520 214 590 202" fill="none" stroke="#28567f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="112" cy="360" r="6" fill="#ffffff" stroke="#5c91c7" stroke-width="3"/><circle cx="205" cy="344" r="6" fill="#ffffff" stroke="#5c91c7" stroke-width="3"/><circle cx="300" cy="306" r="6" fill="#ffffff" stroke="#5c91c7" stroke-width="3"/><circle cx="420" cy="270" r="6" fill="#ffffff" stroke="#5c91c7" stroke-width="3"/><circle cx="510" cy="228" r="6" fill="#ffffff" stroke="#5c91c7" stroke-width="3"/><circle cx="590" cy="202" r="6" fill="#ffffff" stroke="#5c91c7" stroke-width="3" class="typing"/><text x="112" y="420" text-anchor="middle" class="micro">Purchase</text><text x="590" y="420" text-anchor="middle" class="micro">Today</text><rect x="662" y="140" width="296" height="300" rx="14" fill="#102b45" /><text x="934" y="178" text-anchor="end" class="label white">Real return</text><text x="686" y="176" text-anchor="start" class="micro muted">Example</text><text x="934" y="214" text-anchor="end" class="micro muted">Value growth</text><rect x="686" y="226" width="238" height="12" rx="6" fill="#173a55" /><rect x="686" y="226" width="190" height="12" rx="6" fill="#5c91c7" /><text x="934" y="272" text-anchor="end" class="micro muted">Purchase cost</text><rect x="686" y="284" width="238" height="12" rx="6" fill="#173a55" /><rect x="686" y="284" width="132" height="12" rx="6" fill="#a9c6e2" /><text x="934" y="330" text-anchor="end" class="micro muted">Inflation</text><rect x="686" y="342" width="238" height="12" rx="6" fill="#173a55" /><rect x="686" y="342" width="92" height="12" rx="6" fill="#d5e5ef" /><path d="M686 374L934 374" stroke="#a9c6e2" stroke-opacity="0.2"/><text x="934" y="410" text-anchor="end" class="label white">Real return</text><rect x="686" y="394" width="124" height="24" rx="7" fill="#e8f2f8" /><text x="748" y="412" text-anchor="middle" class="micro">Result</text><rect x="66" y="462" width="892" height="92" rx="12" fill="#e8f2f8" /><text x="934" y="493" text-anchor="end" class="label">Sell or hold</text><text x="934" y="524" text-anchor="end" class="micro">The result depends on unit data, costs and holding period</text><rect x="90" y="480" width="124" height="52" rx="8" fill="#ffffff" /><text x="152" y="511" text-anchor="middle" class="label">Sell</text><rect x="230" y="480" width="124" height="52" rx="8" fill="#ffffff" /><text x="292" y="511" text-anchor="middle" class="label">Hold</text><path d="M376 506H548" stroke="#5c91c7" stroke-width="2"/><circle cx="462" cy="506" r="7" fill="#28567f"/></g></g><style>*{animation:none!important}.enter,.chartbar,.bar-deduction,.orbit,.float-object,.trace,.plan-scan,.review-check,.loop-weave,.core-breathe,.intent-wash,.phase-light,.rise,.lift-in,.sheen,.drift-slow,.drift-tilt,.halo-pulse{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.packet,.plan-scan,.loop-energy,.signal-runner,.spark,.ribbon-mote,.synapse,.answer-edge{display:none!important}</style></svg>