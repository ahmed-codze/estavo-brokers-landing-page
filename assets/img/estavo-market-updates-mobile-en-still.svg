<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 430" role="img" aria-labelledby="art-title art-desc"><title id="art-title">Estavo market updates mobile</title><desc id="art-desc">Example product interface and data visualization; no verified prices or availability are asserted.</desc><defs>
<linearGradient id="route" x1="0" x2="1"><stop stop-color="#5c91c7" stop-opacity=".16"/><stop offset="1" stop-color="#5c91c7" stop-opacity=".72"/></linearGradient>
<linearGradient id="soft-sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="640"><rect class="scene-sweep" x="-300" width="260" height="640" fill="url(#soft-sweep)"/></mask>
<style>@font-face{font-family:ArtPlex;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:ArtPlex;font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:ArtPlex,Arial,sans-serif;fill:#0b2239;font-size:21px;font-weight:400}.display{font-size:28px;font-weight:500}.title{font-size:24px;font-weight:500}.label{font-size:21px;font-weight:500}.small{font-size:19px;fill:#47749a}.micro{font-size:17px;fill:#47749a}.white{fill:#f5f9fc}.muted{fill:#a9c6e2}.mini{fill:none;stroke:#28567f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mini-light{stroke:#a9c6e2}.route{fill:none;stroke:url(#route);stroke-width:2;stroke-linecap:round}.energy{fill:none;stroke:#5c91c7;stroke-width:3;stroke-linecap:round}.float-a,.float-b,.float-c{transform-box:fill-box;transform-origin:center}.typing{opacity:.45}
@media(prefers-reduced-motion:no-preference){.scene-sweep{animation:sweep 11s cubic-bezier(.4,0,.2,1) infinite}.scene-float{animation:scene-float 13s ease-in-out infinite}.typing{animation:typing 1.4s ease-in-out infinite}}
@keyframes sweep{0%,12%{transform:translateX(0)}82%,100%{transform:translateX(1500px)}}@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes float-c{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes typing{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
@keyframes scene-float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.energy{display:none}.typing{opacity:.55;transform:none}}
</style></defs><g class="scene-float"><rect x="16" y="18" width="358" height="394" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><text x="354" y="49" text-anchor="end" class="label ">Estavo review</text><text x="36" y="47" text-anchor="start" class="micro ">Market changes</text><path d="M36 65L354 65" stroke="#dce7ef" stroke-opacity="1"/><rect x="32" y="80" width="98" height="44" rx="8" fill="#f7fafc" stroke="#dce7ef"/><text x="81" y="107" text-anchor="middle" class="micro" style="font-size:12px">New project</text><rect x="140" y="80" width="98" height="44" rx="8" fill="#f7fafc" stroke="#dce7ef"/><text x="189" y="107" text-anchor="middle" class="micro" style="font-size:12px">Price changed</text><rect x="248" y="80" width="98" height="44" rx="8" fill="#e8f2f8" stroke="#dce7ef"/><text x="297" y="107" text-anchor="middle" class="micro" style="font-size:12px">Plan changed</text><text x="352" y="154" text-anchor="end" class="label">Update example · Project A</text><text x="352" y="178" text-anchor="end" class="micro">New Cairo · 3-room apartment</text><path d="M32 190L358 190" stroke="#dce7ef" stroke-opacity="1"/><rect x="32" y="202" width="326" height="48" rx="7" fill="#f7fafc" /><text x="346" y="221" text-anchor="end" class="micro">Price</text><text x="276" y="241" text-anchor="middle" class="micro" style="font-size:14px">Before review</text><text x="132" y="241" text-anchor="middle" class="label" style="font-size:17px">After review</text><path d="M221 236H183m8-6-8 6 8 6" fill="none" stroke="#5c91c7" stroke-width="1.7"/><rect x="32" y="257" width="326" height="48" rx="7" fill="#e8f2f8" /><text x="346" y="276" text-anchor="end" class="micro">Payment plan</text><text x="276" y="296" text-anchor="middle" class="micro" style="font-size:14px">Previous plan</text><text x="132" y="296" text-anchor="middle" class="label" style="font-size:17px">Current plan</text><path d="M221 291H183m8-6-8 6 8 6" fill="none" stroke="#5c91c7" stroke-width="1.7"/><rect x="32" y="312" width="326" height="48" rx="7" fill="#f7fafc" /><text x="346" y="331" text-anchor="end" class="micro">Unit status</text><text x="276" y="351" text-anchor="middle" class="micro" style="font-size:14px">Available</text><text x="132" y="351" text-anchor="middle" class="label" style="font-size:17px">Limited</text><path d="M221 346H183m8-6-8 6 8 6" fill="none" stroke="#5c91c7" stroke-width="1.7"/><rect x="32" y="370" width="326" height="28" rx="7" fill="#102b45" /><g transform="translate(40 375) scale(0.75)" class="mini mini-light"><path d="m5 12 4 4L19 6"/></g><text x="348" y="390" text-anchor="end" class="micro white" style="font-size:14px">Illustrative example · after review</text></g><style>*{animation:none!important}.enter,.chartbar,.bar-deduction,.orbit,.float-object,.trace,.plan-scan,.review-check,.loop-weave,.core-breathe,.intent-wash,.phase-light,.rise,.lift-in,.sheen,.drift-slow,.drift-tilt,.halo-pulse{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.packet,.plan-scan,.loop-energy,.signal-runner,.spark,.ribbon-mote,.synapse,.answer-edge{display:none!important}</style></svg>