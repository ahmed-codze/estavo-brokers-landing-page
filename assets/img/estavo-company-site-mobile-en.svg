<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 430" role="img" aria-labelledby="art-title art-desc"><title id="art-title">Estavo company site mobile</title><desc id="art-desc">Example product interface and data visualization; no verified prices or availability are asserted.</desc><defs>
<linearGradient id="route" x1="0" x2="1"><stop stop-color="#5c91c7" stop-opacity=".16"/><stop offset="1" stop-color="#5c91c7" stop-opacity=".72"/></linearGradient>
<linearGradient id="soft-sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="640"><rect class="scene-sweep" x="-300" width="260" height="640" fill="url(#soft-sweep)"/></mask>
<style>@font-face{font-family:ArtPlex;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:ArtPlex;font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:ArtPlex,Arial,sans-serif;fill:#0b2239;font-size:21px;font-weight:400}.display{font-size:28px;font-weight:500}.title{font-size:24px;font-weight:500}.label{font-size:21px;font-weight:500}.small{font-size:19px;fill:#47749a}.micro{font-size:17px;fill:#47749a}.white{fill:#f5f9fc}.muted{fill:#a9c6e2}.mini{fill:none;stroke:#28567f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mini-light{stroke:#a9c6e2}.route{fill:none;stroke:url(#route);stroke-width:2;stroke-linecap:round}.energy{fill:none;stroke:#5c91c7;stroke-width:3;stroke-linecap:round}.float-a,.float-b,.float-c{transform-box:fill-box;transform-origin:center}.typing{opacity:.45}
@media(prefers-reduced-motion:no-preference){.scene-sweep{animation:sweep 11s cubic-bezier(.4,0,.2,1) infinite}.scene-float{animation:scene-float 13s ease-in-out infinite}.typing{animation:typing 1.4s ease-in-out infinite}}
@keyframes sweep{0%,12%{transform:translateX(0)}82%,100%{transform:translateX(1500px)}}@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes float-c{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes typing{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
@keyframes scene-float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.energy{display:none}.typing{opacity:.55;transform:none}}
</style></defs><g class="scene-float"><rect x="16" y="18" width="358" height="394" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><rect x="16" y="18" width="358" height="38" rx="18" fill="#f1f5f8" /><rect x="16" y="39" width="358" height="17" rx="0" fill="#f1f5f8" /><text x="356" y="43" text-anchor="end" class="label">Company website</text><text x="32" y="42" text-anchor="start" class="micro" style="font-size:12px">yourcompany.com</text><path d="M32 57L358 57" stroke="#dce7ef" stroke-opacity="1"/><rect x="32" y="74" width="326" height="118" rx="10" fill="#102b45" /><g transform="translate(42 82) scale(0.6125 0.6666666666666666)"><rect width="160" height="150" rx="8" fill="#dcecf5"/><circle cx="126" cy="26" r="13" fill="#f5f9fc"/><path d="M0 119H160V150H0Z" fill="#c0d7e8"/><path d="M15 117V54H62V29H139V117Z" fill="#f5f9fc"/><path d="M62 29H139V35H62ZM15 54H62V60H15Z" fill="#28567f"/><path d="M72 43H94V63H72ZM105 43H128V63H105ZM72 76H94V96H72ZM105 76H128V96H105ZM25 68H49V88H25Z" fill="#47749a"/><path d="M82 43V63M116 43V63M82 76V96M116 76V96M37 68V88" stroke="#a9c6e2" stroke-width="1.5"/><path d="M67 64H134M67 97H134M21 89H54" stroke="#28567f" stroke-width="2"/><path d="M69 59V65M77 59V65M85 59V65M93 59V65M101 59V65M109 59V65M117 59V65M125 59V65M133 59V65M69 92V98M85 92V98M101 92V98M117 92V98M133 92V98" stroke="#28567f" stroke-width="1"/><path d="M25 103H49V117H25Z" fill="#28567f"/><path d="M37 103V117M54 117H144M11 124H145M34 132H127" stroke="#a9c6e2" stroke-width="2"/><path d="M21 137H67L54 150H0Z" fill="#e8f2f8"/><path d="M148 93V121M7 102V122" stroke="#28567f" stroke-width="2"/><circle cx="148" cy="89" r="8" fill="#5c91c7"/><circle cx="7" cy="99" r="6" fill="#5c91c7"/></g><text x="344" y="105" text-anchor="end" class="label white">Your company</text><text x="344" y="134" text-anchor="end" class="micro muted">Selected company listings</text><rect x="208" y="154" width="126" height="22" rx="6" fill="#ffffff" /><g transform="translate(306 155) scale(0.75)" class="mini"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></g><text x="296" y="170" text-anchor="end" class="micro">Fifth Settlement</text><rect x="32" y="208" width="326" height="88" rx="10" fill="#102b45" /><text x="344" y="232" text-anchor="end" class="label white">Inventory management</text><rect x="48" y="246" width="140" height="34" rx="7" fill="#173a55" /><text x="178" y="268" text-anchor="end" class="micro muted" style="font-size:11px">Updated market data</text><rect x="202" y="246" width="140" height="34" rx="7" fill="#173a55" /><text x="332" y="268" text-anchor="end" class="micro muted" style="font-size:11px">Your property data</text><rect x="32" y="312" width="326" height="70" rx="9" fill="#f7fafc" stroke="#dce7ef"/><text x="344" y="334" text-anchor="end" class="label" style="font-size:16px">Handoff to the sales team</text><text x="48" y="333" text-anchor="start" class="micro" style="font-size:11px">Shared by client</text><rect x="48" y="348" width="112" height="22" rx="6" fill="#e8f2f8" /><text x="152" y="364" text-anchor="end" class="micro" style="font-size:11px">Buyer’s explicit request</text><path d="M168 359H216" class="route"/><path d="M168 359H216" class="energy" mask="url(#sweep)"/><rect x="224" y="348" width="118" height="22" rx="6" fill="#ffffff" stroke="#dce7ef"/><text x="334" y="364" text-anchor="end" class="micro" style="font-size:11px">Sales team</text></g></svg>