  <symbol id="price-m2" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="9.5" width="11" height="11" rx="1"/><path d="M3.5 13.5h3M7.5 9.5v3"/><circle cx="17" cy="7" r="3.5"/><path d="M17 5.6v2.8"/></g></symbol>
  <symbol id="down-payment" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="7.5" width="17" height="12" rx="2"/><path d="M15.5 13.5h5"/><path d="M6.5 7.5l8.5-3.5 1.4 3.5"/></g></symbol>
