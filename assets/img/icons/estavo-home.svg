  <symbol id="price-list" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14M5 10h14M5 15h9M5 20h6"/></g></symbol>
  <symbol id="availability" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="m8 12 3 3 5-6"/></g></symbol>
  <symbol id="sheet" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 4.5v15"/></g></symbol>
  <symbol id="message" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v9A1.5 1.5 0 0 1 19 17h-8l-5 3.5V17H5a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 5 5z"/></g></symbol>
  <symbol id="launch" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 2.5 4.5 6 4 10l-2.5 2.5h-3L8 13c-.5-4 1-7.5 4-10z"/><path d="M10 18.5 9 21M14 18.5l1 2.5"/><circle cx="12" cy="9.5" r="1.5"/></g></symbol>
  <symbol id="map-pin" viewBox="0 0 24 30"><path fill="currentColor" stroke="#ffffff" stroke-width="1.5" d="M12 1.5C6.2 1.5 1.5 6.1 1.5 11.8c0 7.4 9 15.3 9.9 16.1a.9.9 0 0 0 1.2 0c.9-.8 9.9-8.7 9.9-16.1C22.5 6.1 17.8 1.5 12 1.5z"/><circle cx="12" cy="11.6" r="3.8" fill="#ffffff"/></symbol>
</svg>
