<svg xmlns="http://www.w3.org/2000/svg">
  <!-- Estavo homepage icon system. One family: 24px grid, 1.75px stroke,
       round caps/joins, currentColor (Estavo blue by default; mint only
       when a parent marks a resolved intelligence state). Use with
       <svg class="es-home-ic"><use href="…/estavo-home.svg#name"/></svg>. -->

  <!-- Place and property -->
  <symbol id="location" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.7-6.5-11.2a6.5 6.5 0 0 1 13 0C18.5 15.3 12 21 12 21z"/><circle cx="12" cy="9.8" r="2.3"/></g></symbol>
  <symbol id="project" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 20.5h17"/><path d="M5.5 20.5V9.2L10.5 6l5 3.2v11.3"/><path d="M15.5 13.5h3v7"/><path d="M8.5 11.5h4M8.5 15h4"/></g></symbol>
  <symbol id="unit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="1.5"/><path d="M8.5 7.5h2.5M13 7.5h2.5M8.5 11h2.5M13 11h2.5"/><path d="M10.5 20.5v-4h3v4"/></g></symbol>
  <symbol id="area" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path d="M9 12h6"/></g></symbol>
  <symbol id="amenities" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="4.5"/><path d="M12 13.5v7M8.5 20.5h7"/><path d="M12 9.5l1.7-1.7"/></g></symbol>
  <symbol id="finishing" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="13" height="5" rx="1.5"/><path d="M17 6.5h2.5v5H11.5v3"/><rect x="10" y="14.5" width="3" height="6" rx="1"/></g></symbol>
  <symbol id="maintenance" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.8 4.6a4.4 4.4 0 0 0-4.2 5.7L4.8 16.1a2 2 0 0 0 2.9 2.9l5.8-5.8a4.4 4.4 0 0 0 5.7-4.2l-2.6 2.6-2.4-.6-.6-2.4z"/></g></symbol>
  <symbol id="delivery" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="15.5" r="3.5"/><path d="M10.5 13 19 4.5M16 7.5l2.2 2.2M13.8 9.7l1.6 1.6"/></g></symbol>
  <symbol id="live-in" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5v10H4z"/><path d="M12 17.2s-2.8-1.6-2.8-3.3a1.4 1.4 0 0 1 2.8-.6 1.4 1.4 0 0 1 2.8.6c0 1.7-2.8 3.3-2.8 3.3z"/></g></symbol>

  <!-- Money and terms -->
