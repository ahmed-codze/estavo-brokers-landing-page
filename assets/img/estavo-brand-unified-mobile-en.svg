<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 430" role="img" aria-labelledby="art-title art-desc"><title id="art-title">Estavo brand unified mobile</title><desc id="art-desc">Example product interface and data visualization; no verified prices or availability are asserted.</desc><defs>
<linearGradient id="route" x1="0" x2="1"><stop stop-color="#5c91c7" stop-opacity=".16"/><stop offset="1" stop-color="#5c91c7" stop-opacity=".72"/></linearGradient>
<linearGradient id="soft-sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="640"><rect class="scene-sweep" x="-300" width="260" height="640" fill="url(#soft-sweep)"/></mask>
<style>@font-face{font-family:ArtPlex;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:ArtPlex;font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:ArtPlex,Arial,sans-serif;fill:#0b2239;font-size:21px;font-weight:400}.display{font-size:28px;font-weight:500}.title{font-size:24px;font-weight:500}.label{font-size:21px;font-weight:500}.small{font-size:19px;fill:#47749a}.micro{font-size:17px;fill:#47749a}.white{fill:#f5f9fc}.muted{fill:#a9c6e2}.mini{fill:none;stroke:#28567f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mini-light{stroke:#a9c6e2}.route{fill:none;stroke:url(#route);stroke-width:2;stroke-linecap:round}.energy{fill:none;stroke:#5c91c7;stroke-width:3;stroke-linecap:round}.float-a,.float-b,.float-c{transform-box:fill-box;transform-origin:center}.typing{opacity:.45}
@media(prefers-reduced-motion:no-preference){.scene-sweep{animation:sweep 11s cubic-bezier(.4,0,.2,1) infinite}.scene-float{animation:scene-float 13s ease-in-out infinite}.typing{animation:typing 1.4s ease-in-out infinite}}
@keyframes sweep{0%,12%{transform:translateX(0)}82%,100%{transform:translateX(1500px)}}@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes float-c{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes typing{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
@keyframes scene-float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.energy{display:none}.typing{opacity:.55;transform:none}}
</style></defs><g class="scene-float"><rect x="16" y="18" width="358" height="394" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><rect x="16" y="18" width="358" height="38" rx="20" fill="#f1f5f8" /><rect x="16" y="39" width="358" height="17" rx="0" fill="#f1f5f8" /><text x="356" y="43" text-anchor="end" class="label">Your branded website</text><text x="32" y="42" text-anchor="start" class="micro" style="font-size:12px">yourcompany.com</text><path d="M32 57L358 57" stroke="#dce7ef" stroke-opacity="1"/><rect x="32" y="74" width="326" height="126" rx="10" fill="#102b45" /><g transform="translate(40 82) scale(0.65625 0.72)"><rect width="160" height="150" rx="8" fill="#dcecf5"/><circle cx="126" cy="26" r="13" fill="#f5f9fc"/><path d="M0 119H160V150H0Z" fill="#c0d7e8"/><path d="M15 117V54H62V29H139V117Z" fill="#f5f9fc"/><path d="M62 29H139V35H62ZM15 54H62V60H15Z" fill="#28567f"/><path d="M72 43H94V63H72ZM105 43H128V63H105ZM72 76H94V96H72ZM105 76H128V96H105ZM25 68H49V88H25Z" fill="#47749a"/><path d="M82 43V63M116 43V63M82 76V96M116 76V96M37 68V88" stroke="#a9c6e2" stroke-width="1.5"/><path d="M67 64H134M67 97H134M21 89H54" stroke="#28567f" stroke-width="2"/><path d="M69 59V65M77 59V65M85 59V65M93 59V65M101 59V65M109 59V65M117 59V65M125 59V65M133 59V65M69 92V98M85 92V98M101 92V98M117 92V98M133 92V98" stroke="#28567f" stroke-width="1"/><path d="M25 103H49V117H25Z" fill="#28567f"/><path d="M37 103V117M54 117H144M11 124H145M34 132H127" stroke="#a9c6e2" stroke-width="2"/><path d="M21 137H67L54 150H0Z" fill="#e8f2f8"/><path d="M148 93V121M7 102V122" stroke="#28567f" stroke-width="2"/><circle cx="148" cy="89" r="8" fill="#5c91c7"/><circle cx="7" cy="99" r="6" fill="#5c91c7"/></g><text x="344" y="106" text-anchor="end" class="label white">Your next home</text><text x="344" y="133" text-anchor="end" class="label white">starts here</text><text x="344" y="161" text-anchor="end" class="micro muted">Explore homes for you</text><rect x="46" y="214" width="298" height="96" rx="11" fill="#ffffff" stroke="#dce7ef"/><rect x="46" y="214" width="298" height="34" rx="11" fill="#102b45" /><rect x="46" y="236" width="298" height="12" rx="0" fill="#102b45" /><g transform="translate(58 221) scale(0.75)" class="mini mini-light"><path d="M4 4h16v12H9l-5 4Z"/><path d="M8 9h8M8 12h5"/></g><text x="332" y="237" text-anchor="end" class="micro white">Branded AI</text><rect x="68" y="257" width="264" height="24" rx="7" fill="#e8f2f8" /><text x="320" y="274" text-anchor="end" class="micro" style="font-size:13px">Compare 3-room payment plans?</text><rect x="98" y="287" width="234" height="17" rx="6" fill="#f1f5f8" /><text x="320" y="300" text-anchor="end" class="micro" style="font-size:12px">Preparing…</text><rect x="32" y="326" width="326" height="54" rx="9" fill="#f7fafc" stroke="#dce7ef"/><g transform="translate(44 340) scale(0.8333333333333334)" class="mini"><path d="M9 15 7 17a4 4 0 0 1-6-6l3-3a4 4 0 0 1 6 0M15 9l2-2a4 4 0 0 1 6 6l-3 3a4 4 0 0 1-6 0M8 12h8"/></g><text x="346" y="348" text-anchor="end" class="micro">Estavo Data API</text><text x="346" y="370" text-anchor="end" class="micro">Same data in your platform</text></g></svg>