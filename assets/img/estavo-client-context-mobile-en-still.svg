<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 430" role="img" aria-labelledby="art-title art-desc"><title id="art-title">Estavo client context mobile</title><desc id="art-desc">Example product interface and data visualization; no verified prices or availability are asserted.</desc><defs>
<linearGradient id="route" x1="0" x2="1"><stop stop-color="#5c91c7" stop-opacity=".16"/><stop offset="1" stop-color="#5c91c7" stop-opacity=".72"/></linearGradient>
<linearGradient id="soft-sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="640"><rect class="scene-sweep" x="-300" width="260" height="640" fill="url(#soft-sweep)"/></mask>
<style>@font-face{font-family:ArtPlex;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:ArtPlex;font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:ArtPlex,Arial,sans-serif;fill:#0b2239;font-size:21px;font-weight:400}.display{font-size:28px;font-weight:500}.title{font-size:24px;font-weight:500}.label{font-size:21px;font-weight:500}.small{font-size:19px;fill:#47749a}.micro{font-size:17px;fill:#47749a}.white{fill:#f5f9fc}.muted{fill:#a9c6e2}.mini{fill:none;stroke:#28567f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mini-light{stroke:#a9c6e2}.route{fill:none;stroke:url(#route);stroke-width:2;stroke-linecap:round}.energy{fill:none;stroke:#5c91c7;stroke-width:3;stroke-linecap:round}.float-a,.float-b,.float-c{transform-box:fill-box;transform-origin:center}.typing{opacity:.45}
@media(prefers-reduced-motion:no-preference){.scene-sweep{animation:sweep 11s cubic-bezier(.4,0,.2,1) infinite}.scene-float{animation:scene-float 13s ease-in-out infinite}.typing{animation:typing 1.4s ease-in-out infinite}}
@keyframes sweep{0%,12%{transform:translateX(0)}82%,100%{transform:translateX(1500px)}}@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes float-c{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes typing{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
@keyframes scene-float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.energy{display:none}.typing{opacity:.55;transform:none}}
</style></defs><g class="scene-float"><rect x="32" y="24" width="98" height="60" rx="10" fill="#102b45" stroke="#274b68" stroke-width="1.5"/><g transform="translate(42 42) scale(0.75)" class="mini mini-light"><circle cx="10" cy="10" r="6"/><path d="m15 15 5 5"/></g><text x="120" y="58" text-anchor="end" class="micro white" style="font-size:11px">Search</text><path d="M81 84V108" class="route"/><path d="M81 84V108" class="energy" mask="url(#sweep)"/><rect x="140" y="24" width="98" height="60" rx="10" fill="#102b45" stroke="#274b68" stroke-width="1.5"/><g transform="translate(150 42) scale(0.75)" class="mini mini-light"><path d="M3 12s3-5 9-5 9 5 9 5-3 5-9 5-9-5-9-5Z"/><circle cx="12" cy="12" r="2"/></g><text x="228" y="58" text-anchor="end" class="micro white" style="font-size:11px">Views</text><path d="M189 84V108" class="route"/><path d="M189 84V108" class="energy" mask="url(#sweep)"/><rect x="248" y="24" width="98" height="60" rx="10" fill="#102b45" stroke="#274b68" stroke-width="1.5"/><g transform="translate(258 42) scale(0.75)" class="mini mini-light"><path d="M4 20V4M4 20h16M7 16l4-5 3 2 5-7"/></g><text x="336" y="58" text-anchor="end" class="micro white" style="font-size:11px">Comparison</text><path d="M297 84V108" class="route"/><path d="M297 84V108" class="energy" mask="url(#sweep)"/><rect x="32" y="108" width="326" height="252" rx="16" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><text x="342" y="140" text-anchor="end" class="label">Call brief</text><text x="48" y="138" text-anchor="start" class="micro">From their interactions</text><path d="M48 154L342 154" stroke="#dce7ef" stroke-opacity="1"/><rect x="48" y="170" width="294" height="54" rx="9" fill="#f7fafc" /><g transform="translate(60 185) scale(0.7916666666666666)" class="mini"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></g><text x="330" y="192" text-anchor="end" class="label" style="font-size:15px">3-room unit</text><text x="330" y="214" text-anchor="end" class="micro">Fifth Settlement</text><rect x="48" y="238" width="294" height="54" rx="9" fill="#e8f2f8" /><g transform="translate(60 253) scale(0.7916666666666666)" class="mini"><path d="M4 20V4M4 20h16M7 16l4-5 3 2 5-7"/></g><text x="330" y="261" text-anchor="end" class="label" style="font-size:15px">Payment plans</text><text x="330" y="283" text-anchor="end" class="micro">Compared several plans</text><path d="M48 308L342 308" stroke="#dce7ef" stroke-opacity="1"/><g transform="translate(60 321) scale(0.7916666666666666)" class="mini"><path d="M4 4h16v12H9l-5 4Z"/><path d="M8 9h8M8 12h5"/></g><text x="330" y="336" text-anchor="end" class="label" style="font-size:15px">Ask about the right payment plan</text></g><style>*{animation:none!important}.enter,.chartbar,.bar-deduction,.orbit,.float-object,.trace,.plan-scan,.review-check,.loop-weave,.core-breathe,.intent-wash,.phase-light,.rise,.lift-in,.sheen,.drift-slow,.drift-tilt,.halo-pulse{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.packet,.plan-scan,.loop-energy,.signal-runner,.spark,.ribbon-mote,.synapse,.answer-edge{display:none!important}</style></svg>