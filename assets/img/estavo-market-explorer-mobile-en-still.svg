<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 430" role="img" aria-labelledby="art-title art-desc"><title id="art-title">Estavo market explorer mobile</title><desc id="art-desc">Example product interface and data visualization; no verified prices or availability are asserted.</desc><defs>
<linearGradient id="route" x1="0" x2="1"><stop stop-color="#5c91c7" stop-opacity=".16"/><stop offset="1" stop-color="#5c91c7" stop-opacity=".72"/></linearGradient>
<linearGradient id="soft-sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="640"><rect class="scene-sweep" x="-300" width="260" height="640" fill="url(#soft-sweep)"/></mask>
<style>@font-face{font-family:ArtPlex;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:ArtPlex;font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:ArtPlex,Arial,sans-serif;fill:#0b2239;font-size:21px;font-weight:400}.display{font-size:28px;font-weight:500}.title{font-size:24px;font-weight:500}.label{font-size:21px;font-weight:500}.small{font-size:19px;fill:#47749a}.micro{font-size:17px;fill:#47749a}.white{fill:#f5f9fc}.muted{fill:#a9c6e2}.mini{fill:none;stroke:#28567f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mini-light{stroke:#a9c6e2}.route{fill:none;stroke:url(#route);stroke-width:2;stroke-linecap:round}.energy{fill:none;stroke:#5c91c7;stroke-width:3;stroke-linecap:round}.float-a,.float-b,.float-c{transform-box:fill-box;transform-origin:center}.typing{opacity:.45}
@media(prefers-reduced-motion:no-preference){.scene-sweep{animation:sweep 11s cubic-bezier(.4,0,.2,1) infinite}.scene-float{animation:scene-float 13s ease-in-out infinite}.typing{animation:typing 1.4s ease-in-out infinite}}
@keyframes sweep{0%,12%{transform:translateX(0)}82%,100%{transform:translateX(1500px)}}@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes float-c{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes typing{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
@keyframes scene-float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.energy{display:none}.typing{opacity:.55;transform:none}}
</style></defs><g class="scene-float"><text x="18" y="27" text-anchor="start" class="label">Market sources</text><rect x="16" y="43" width="110" height="57" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><g transform="translate(24 56) scale(0.75)" class="mini"><path d="M4 4h16v12H9l-5 4Z"/><path d="M8 9h8M8 12h5"/></g><text x="116" y="76" text-anchor="end" class="micro" style="font-size:14px">WhatsApp</text><rect x="136" y="43" width="110" height="57" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><g transform="translate(144 56) scale(0.75)" class="mini"><path d="M6 3h8l4 4v14H6Z"/><path d="M14 3v5h5M9 12h6M9 16h6"/></g><text x="236" y="76" text-anchor="end" class="micro" style="font-size:14px">PDF</text><rect x="256" y="43" width="110" height="57" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><g transform="translate(264 56) scale(0.75)" class="mini"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></g><text x="356" y="76" text-anchor="end" class="micro" style="font-size:14px">Websites</text><path d="M71 100V121H195" class="route"/><path d="M71 100V121H195" class="energy" mask="url(#sweep)"/><path d="M191 100V121H195" class="route"/><path d="M191 100V121H195" class="energy" mask="url(#sweep)"/><path d="M311 100V121H195" class="route"/><path d="M311 100V121H195" class="energy" mask="url(#sweep)"/><rect x="16" y="121" width="358" height="278" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><text x="354" y="152" text-anchor="end" class="label ">Estavo Market</text><text x="36" y="150" text-anchor="start" class="micro ">Search and compare</text><path d="M36 168L354 168" stroke="#dce7ef" stroke-opacity="1"/><rect x="32" y="181" width="156" height="32" rx="7" fill="#f1f5f8" /><text x="176" y="203" text-anchor="end" class="micro ">Fifth Settlement</text><rect x="202" y="181" width="156" height="32" rx="7" fill="#f1f5f8" /><text x="346" y="203" text-anchor="end" class="micro ">3 rooms</text><rect x="32" y="230" width="326" height="58" rx="8" fill="#f7fafc" stroke="#dce7ef"/><text x="344" y="255" text-anchor="end" class="label">Project A</text><text x="344" y="277" text-anchor="end" class="micro">Per project · payment plan</text><rect x="32" y="300" width="326" height="58" rx="8" fill="#f7fafc" stroke="#dce7ef"/><text x="344" y="325" text-anchor="end" class="label">Project B</text><text x="344" y="347" text-anchor="end" class="micro">Per project · payment plan</text><rect x="32" y="370" width="326" height="16" rx="5" fill="#e8f2f8" /></g><style>*{animation:none!important}.enter,.chartbar,.bar-deduction,.orbit,.float-object,.trace,.plan-scan,.review-check,.loop-weave,.core-breathe,.intent-wash,.phase-light,.rise,.lift-in,.sheen,.drift-slow,.drift-tilt,.halo-pulse{opacity:1!important;transform:none!important;stroke-dashoffset:0!important}.packet,.plan-scan,.loop-energy,.signal-runner,.spark,.ribbon-mote,.synapse,.answer-edge{display:none!important}</style></svg>