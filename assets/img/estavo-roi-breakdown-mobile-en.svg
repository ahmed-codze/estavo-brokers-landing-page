<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 430" role="img" aria-labelledby="art-title art-desc"><title id="art-title">Estavo roi breakdown mobile</title><desc id="art-desc">Example product interface and data visualization; no verified prices or availability are asserted.</desc><defs>
<linearGradient id="route" x1="0" x2="1"><stop stop-color="#5c91c7" stop-opacity=".16"/><stop offset="1" stop-color="#5c91c7" stop-opacity=".72"/></linearGradient>
<linearGradient id="soft-sweep"><stop stop-color="white" stop-opacity="0"/><stop offset=".5" stop-color="white"/><stop offset="1" stop-color="white" stop-opacity="0"/></linearGradient>
<mask id="sweep" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="640"><rect class="scene-sweep" x="-300" width="260" height="640" fill="url(#soft-sweep)"/></mask>
<style>@font-face{font-family:ArtPlex;font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format("woff2")}@font-face{font-family:ArtPlex;font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format("woff2")}
text{font-family:ArtPlex,Arial,sans-serif;fill:#0b2239;font-size:21px;font-weight:400}.display{font-size:28px;font-weight:500}.title{font-size:24px;font-weight:500}.label{font-size:21px;font-weight:500}.small{font-size:19px;fill:#47749a}.micro{font-size:17px;fill:#47749a}.white{fill:#f5f9fc}.muted{fill:#a9c6e2}.mini{fill:none;stroke:#28567f;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.mini-light{stroke:#a9c6e2}.route{fill:none;stroke:url(#route);stroke-width:2;stroke-linecap:round}.energy{fill:none;stroke:#5c91c7;stroke-width:3;stroke-linecap:round}.float-a,.float-b,.float-c{transform-box:fill-box;transform-origin:center}.typing{opacity:.45}
@media(prefers-reduced-motion:no-preference){.scene-sweep{animation:sweep 11s cubic-bezier(.4,0,.2,1) infinite}.scene-float{animation:scene-float 13s ease-in-out infinite}.typing{animation:typing 1.4s ease-in-out infinite}}
@keyframes sweep{0%,12%{transform:translateX(0)}82%,100%{transform:translateX(1500px)}}@keyframes float-a{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes float-b{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}@keyframes float-c{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}@keyframes typing{0%,70%,100%{opacity:.3;transform:translateY(0)}35%{opacity:1;transform:translateY(-2px)}}
@keyframes scene-float{0%,100%{transform:translateY(3px)}50%{transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.energy{display:none}.typing{opacity:.55;transform:none}}
</style></defs><g class="scene-float"><rect x="16" y="18" width="358" height="394" rx="20" fill="#ffffff" stroke="#dce7ef" stroke-width="1.5"/><text x="356" y="50" text-anchor="end" class="label">Return calculation</text><text x="32" y="48" text-anchor="start" class="micro">Example</text><path d="M32 64L358 64" stroke="#dce7ef" stroke-opacity="1"/><rect x="32" y="80" width="326" height="154" rx="10" fill="#f7fafc" stroke="#dce7ef"/><text x="344" y="106" text-anchor="end" class="micro">Price history</text><text x="46" y="105" text-anchor="start" class="micro" style="font-size:13px">From purchase to today</text><path d="M48 140H342" stroke="#dce7ef" stroke-width="1"/><path d="M48 174H342" stroke="#dce7ef" stroke-width="1"/><path d="M48 208H342" stroke="#dce7ef" stroke-width="1"/><path d="M52 201C86 192 112 196 145 179S205 171 236 151S296 126 338 119L338 214H52Z" fill="#dcecf5" fill-opacity=".78"/><path d="M52 201C86 192 112 196 145 179S205 171 236 151S296 126 338 119" fill="none" stroke="#28567f" stroke-width="3" stroke-linecap="round"/><circle cx="52" cy="201" r="4" fill="#ffffff" stroke="#5c91c7" stroke-width="2"/><circle cx="111" cy="194" r="4" fill="#ffffff" stroke="#5c91c7" stroke-width="2"/><circle cx="174" cy="172" r="4" fill="#ffffff" stroke="#5c91c7" stroke-width="2"/><circle cx="236" cy="151" r="4" fill="#ffffff" stroke="#5c91c7" stroke-width="2"/><circle cx="288" cy="132" r="4" fill="#ffffff" stroke="#5c91c7" stroke-width="2"/><circle cx="338" cy="119" r="4" fill="#ffffff" stroke="#5c91c7" stroke-width="2" class="typing"/><rect x="32" y="250" width="326" height="104" rx="10" fill="#102b45" /><text x="342" y="271" text-anchor="end" class="micro muted" style="font-size:13px">Value growth</text><rect x="52" y="261" width="116" height="7" rx="4" fill="#173a55" /><rect x="52" y="261" width="108" height="7" rx="4" fill="#5c91c7" /><text x="342" y="293" text-anchor="end" class="micro muted" style="font-size:13px">Purchase cost</text><rect x="52" y="283" width="116" height="7" rx="4" fill="#173a55" /><rect x="52" y="283" width="72" height="7" rx="4" fill="#a9c6e2" /><text x="342" y="315" text-anchor="end" class="micro muted" style="font-size:13px">Inflation</text><rect x="52" y="305" width="116" height="7" rx="4" fill="#173a55" /><rect x="52" y="305" width="48" height="7" rx="4" fill="#d5e5ef" /><path d="M48 326L342 326" stroke="#a9c6e2" stroke-opacity="0.2"/><text x="342" y="347" text-anchor="end" class="micro white" style="font-size:14px">Real return</text><rect x="52" y="332" width="116" height="16" rx="5" fill="#e8f2f8" /><text x="110" y="345" text-anchor="middle" class="micro" style="font-size:12px">Result</text><rect x="32" y="366" width="326" height="32" rx="8" fill="#e8f2f8" /><text x="344" y="386" text-anchor="end" class="micro" style="font-size:14px">Sell or hold</text><rect x="48" y="371" width="62" height="22" rx="6" fill="#ffffff" /><text x="79" y="387" text-anchor="middle" class="micro" style="font-size:12px">Sell</text><rect x="118" y="371" width="72" height="22" rx="6" fill="#ffffff" /><text x="154" y="387" text-anchor="middle" class="micro" style="font-size:12px">Hold</text></g></svg>