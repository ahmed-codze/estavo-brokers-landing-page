# Execute only the stateless individual-profile document. Never serve its PHP
# source or pass arbitrary scripts to FPM on the otherwise static landing host.
location ~ "^/website/manual-profile\.php/[a-f0-9]{24,32}$" {
    limit_except GET HEAD { deny all; }
    fastcgi_split_path_info ^(/website/manual-profile\.php)(/.*)$;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/website/manual-profile.php;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTP_PROXY "";
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    fastcgi_connect_timeout 5s;
    fastcgi_read_timeout 10s;
    fastcgi_hide_header Cache-Control;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options nosniff always;
    # Profile inputs include the owner's public contact details.
    access_log off;
}

location ~ ^/website/manual-profile\.php(?:/|$) {
    add_header Cache-Control "private, no-store" always;
    return 404;
}
