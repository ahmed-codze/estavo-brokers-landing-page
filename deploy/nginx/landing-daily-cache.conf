# Merge these directives into the EXISTING static landing vhost.
# Preserve its PHP handlers, redirects and onboarding proxy locations.
# Keep cache/, media/ and sibling release directories outside the document root.
root /srv/estavo/landing-editions/current;
autoindex off;

# Fingerprinted thumbnails are immutable. No directory listing or fall-through.
location ^~ /assets/daily/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
}
# The release status is intentionally tiny and useful for an age alert.
location = /edition.json {
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
# Apply to the existing HTML handler; a daily symlink change must be observable.
# add_header Cache-Control "public, max-age=300, must-revalidate" always;
# open_file_cache off;
