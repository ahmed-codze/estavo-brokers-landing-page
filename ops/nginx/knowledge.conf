# Include inside the existing estavo-brokers.com HTTPS server block.
# Removed pages (4 Nov 2026, owner decision): send old links somewhere useful.
#   selling-tips guides -> market news · cash or installments -> Estavo Market · pricing -> broker websites
location ^~ /guides/en/ { return 301 https://estavo-brokers.com/insights/en.html; }
location ^~ /guides     { return 301 https://estavo-brokers.com/insights/; }
location = /roi/en.html { return 301 https://estavo-brokers.com/market/en.html; }
location ^~ /roi        { return 301 https://estavo-brokers.com/market/; }
location = /pricing/en.html { return 301 https://estavo-brokers.com/websites/en.html; }
location ^~ /pricing    { return 301 https://estavo-brokers.com/websites/; }

# Preserve existing inbound links while consolidating on actual static pages.
location ~ ^/(estavo-brokers(?:-en)?|what-is-estavo-brokers(?:-en)?)$ {
    return 301 https://estavo-brokers.com/$1.html$is_args$args;
}
