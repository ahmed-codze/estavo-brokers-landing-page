# Include inside the existing estavo-brokers.com HTTPS server block.
# Knowledge URLs must return 404 when absent, not the landing homepage.
location ^~ /guides/ {
    try_files $uri $uri/ =404;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# Preserve existing inbound links while consolidating on actual static pages.
location ~ ^/(estavo-brokers(?:-en)?|what-is-estavo-brokers(?:-en)?)$ {
    return 301 https://estavo-brokers.com/$1.html$is_args$args;
}
